[project]
name = "crypto-huy-opa"
version = "1.0.0"
description = "Crypto Huy-OPA — Quantitative Crypto Trading Framework & Master Plan by Tran Quang Huy"
authors = [{ name = "Tran Quang Huy" }]
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "statsmodels>=0.14.0",
    "pyarrow>=17.0.0",
    "pyyaml>=6.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
